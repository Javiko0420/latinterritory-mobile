name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Keep in sync with the local toolchain used for releases.
          flutter-version: 3.44.5
          cache: true

      # envied reads these at codegen time; the examples hold placeholders only,
      # so no secrets are needed in CI.
      - name: Create env files from examples
        run: |
          cp .env.development.example .env.development
          cp .env.production.example .env.production

      - name: Install dependencies
        run: flutter pub get

      # *.g.dart and *.freezed.dart are gitignored.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Errors and warnings fail the build; pre-existing infos are tracked as debt.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
